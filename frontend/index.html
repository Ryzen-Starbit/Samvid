<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · Samvid</title>
<link rel="icon" href="/favicon.svg" />
</head>
<body>
<div class="login">
  <section class="sky" aria-hidden="true">
    <div class="copy">
      <div class="row" style="gap:12px"><svg width="40" height="40" viewBox="0 0 32 32"><circle cx="16" cy="16" r="7.5" fill="#1b293d" stroke="#6cc4f0" stroke-width="1.6"/><ellipse cx="16" cy="16" rx="14" ry="5.2" transform="rotate(-24 16 16)" fill="none" stroke="#f5b13d" stroke-width="1.3" stroke-dasharray="2 2.4"/><circle cx="28.2" cy="10.6" r="2" fill="#f5b13d"/></svg><h1>Samvid</h1></div>
      <p>Satellite imagery change analysis</p>
    </div>
    <svg class="globe" viewBox="0 0 640 640">
      <defs>
        <radialGradient id="g" cx="40%" cy="35%"><stop offset="0" stop-color="#21436a"/><stop offset=".7" stop-color="#0f1f33"/><stop offset="1" stop-color="#0b1524"/></radialGradient>
        <clipPath id="clip"><circle cx="320" cy="320" r="230"/></clipPath>
      </defs>
      <circle cx="320" cy="320" r="236" fill="none" stroke="#6cc4f0" stroke-opacity=".18" stroke-width="10"/>
      <circle cx="320" cy="320" r="230" fill="url(#g)"/>
      <g clip-path="url(#clip)" stroke="#6cc4f0" stroke-opacity=".22" fill="none">
        <g class="spin">
          <ellipse cx="320" cy="320" rx="230" ry="230"/><ellipse cx="320" cy="320" rx="170" ry="230"/><ellipse cx="320" cy="320" rx="100" ry="230"/><ellipse cx="320" cy="320" rx="30" ry="230"/>
        </g>
        <path d="M90 320h460M110 220h420M110 420h420M160 140h320M160 500h320"/>
        <!-- land masses as dotted fields -->
        <g fill="#4fb06d" fill-opacity=".35" stroke="none">
          <path d="M300 230c40-20 90 0 100 40s-20 60-10 100-30 70-60 50-20-60-50-80-30-90 20-110z"/>
          <path d="M180 300c30-10 60 10 50 40s-40 50-60 30-20-60 10-70z"/>
        </g>
        <g stroke="#f5b13d" stroke-opacity=".9" stroke-width="2"><circle cx="350" cy="300" r="5"/><circle cx="372" cy="352" r="5"/><circle cx="330" cy="372" r="5"/><circle cx="356" cy="250" r="5"/></g>
      </g>
      <ellipse cx="320" cy="320" rx="280" ry="120" transform="rotate(-20 320 320)" fill="none" stroke="#f5b13d" stroke-opacity=".45" stroke-dasharray="3 6"/>
      <g><rect x="-9" y="-4" width="18" height="8" rx="2" fill="#e8eef6"/><rect x="-26" y="-3" width="14" height="6" fill="#6cc4f0"/><rect x="12" y="-3" width="14" height="6" fill="#6cc4f0"/><animateMotion dur="16s" repeatCount="indefinite" rotate="auto" path="M 56.9 415.8 A 280 120 -20 1 1 583.1 224.2 A 280 120 -20 1 1 56.9 415.8"/></g>
    </svg>
    <div class="faint small" id="mode-line" style="position:relative;z-index:2">SIH 2026 · Team NullNVoid</div>
  </section>
  <form id="f" autocomplete="on">
    <h2 style="font-size:24px">Sign in</h2>
    <label class="f">Username<input class="input" name="username" value="analyst" autocomplete="username" required></label>
    <label class="f">Password<input class="input" name="password" type="password" value="" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">Sign in</button>
    <div id="google-wrap" class="hidden" style="display:flex;flex-direction:column;gap:14px">
      <div class="or">or</div>
      <button class="btn google" type="button" id="google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google</button>
    </div>
    <div id="err" class="notice bad hidden"></div>
  </form>
</div>
<script type="module" src="/src/pages/login.js"></script>
</body>
</html>
